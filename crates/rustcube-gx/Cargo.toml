[package]
name = "rustcube-gx"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "GameCube GX on wgpu: noclip.website's generic GX code (MIT) translated to Rust, plus a GX-API-shaped state machine for the recompiled game"


[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "metal", "gles"] }
bytemuck = { version = "1.25.2", features = ["derive"] }

[dev-dependencies]
pollster = "0.4.0"
naga = { version = "30.0.2", features = ["wgsl-in"] }

# The browser's backends only in a browser build (a wasi game build decodes
# nothing on the GPU, and wgpu's web backend can't unwind).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "webgl"] }
