[package]
name = "rustcube-hw"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "GameCube hardware replacements for recompiled games: GX pipe, video interface, clock, I/O router, snapshots, profiler, debug port"

[dependencies]
rustcube-recomp = { path = "../rustcube-recomp" }
rustcube-gx = { path = "../rustcube-gx" }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "metal", "gles"] }
pollster = "0.4.0"
png = "0.18.1"
